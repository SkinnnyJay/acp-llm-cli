# Publishes to npm when a version tag (v*) is pushed.
# Do not run manually until you are ready to release — this workflow is a stub for the publish path.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION."
            echo "::error::npm publishes what the manifest says, so this tag would ship a"
            echo "::error::different version than it names. Bump the manifest and re-tag,"
            echo "::error::or delete the stray tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `npm publish` fires prepublishOnly -> verify:coverage (lint, typecheck, build,
      # test:coverage), so running verify here as well would gate twice. What that path does NOT
      # cover is the packaging checks CI runs, so those go here.
      - name: Pack and import smoke
        run: npm run pack:smoke

      - name: Publint packed tarball
        run: npm run publint

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
