# Publishes to npm when a version tag (v*) is pushed.
# Do not run manually until you are ready to release — this workflow is a stub for the publish path.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs this too, so it is deliberate duplication: a
      # failure here reads as its own red step instead of being buried in
      # npm publish output.
      - name: Verify
        run: npm run verify:coverage

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
