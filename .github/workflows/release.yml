# Publishes to npm when a version tag (v*) is pushed.
# Do not run manually until you are ready to release — this workflow is a stub for the publish path.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # `npm publish` fires prepublishOnly -> verify:coverage (lint, typecheck, build,
      # test:coverage), so running verify here as well would gate twice. What that path does NOT
      # cover is the packaging checks CI runs, so those go here.
      - name: Pack and import smoke
        run: npm run pack:smoke

      - name: Publint packed tarball
        run: npm run publint

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
