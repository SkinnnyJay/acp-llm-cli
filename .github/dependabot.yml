version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch and minor updates land as one PR instead of ten.
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned to the engines floor on purpose. @types/node ahead of the
      # oldest supported runtime compiles code that throws for consumers on
      # that floor, so this tracks Node 22, not latest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 6 and 7 build fine but cannot emit declarations: tsup
      # bundles rollup-plugin-dts, which crashes on 7 and errors on 6.
      # Revisit when tsup ships a newer rollup-plugin-dts.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      # The dev copy of zod deliberately sits at the low end of the declared
      # peer range so the default test run exercises it. The peer-zod CI
      # matrix covers zod 4.
      - dependency-name: "zod"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
